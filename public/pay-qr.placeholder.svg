<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" font-family="ui-monospace, 'JetBrains Mono', monospace">
  <!-- 底色：奶白 -->
  <rect width="200" height="200" fill="#f5efe2"/>

  <!-- 三角定位标记（伪二维码外观） -->
  <g fill="#1a1a1a">
    <!-- 左上 -->
    <rect x="14" y="14" width="34" height="34"/>
    <rect x="20" y="20" width="22" height="22" fill="#f5efe2"/>
    <rect x="25" y="25" width="12" height="12"/>
    <!-- 右上 -->
    <rect x="152" y="14" width="34" height="34"/>
    <rect x="158" y="20" width="22" height="22" fill="#f5efe2"/>
    <rect x="163" y="25" width="12" height="12"/>
    <!-- 左下 -->
    <rect x="14" y="152" width="34" height="34"/>
    <rect x="20" y="158" width="22" height="22" fill="#f5efe2"/>
    <rect x="25" y="163" width="12" height="12"/>
  </g>

  <!-- 散点 / 噪点（让它更像二维码） -->
  <g fill="#1a1a1a">
    <rect x="56" y="18" width="6" height="6"/>
    <rect x="68" y="18" width="6" height="6"/>
    <rect x="86" y="18" width="6" height="6"/>
    <rect x="104" y="18" width="6" height="6"/>
    <rect x="122" y="18" width="6" height="6"/>
    <rect x="134" y="30" width="6" height="6"/>
    <rect x="56" y="42" width="6" height="6"/>
    <rect x="80" y="42" width="6" height="6"/>
    <rect x="116" y="42" width="6" height="6"/>
    <rect x="140" y="42" width="6" height="6"/>

    <rect x="14" y="56" width="6" height="6"/>
    <rect x="32" y="56" width="6" height="6"/>
    <rect x="60" y="56" width="6" height="6"/>
    <rect x="138" y="56" width="6" height="6"/>
    <rect x="160" y="56" width="6" height="6"/>
    <rect x="180" y="56" width="6" height="6"/>

    <rect x="44" y="68" width="6" height="6"/>
    <rect x="56" y="68" width="6" height="6"/>
    <rect x="170" y="68" width="6" height="6"/>

    <rect x="20" y="80" width="6" height="6"/>
    <rect x="38" y="80" width="6" height="6"/>
    <rect x="158" y="80" width="6" height="6"/>
    <rect x="178" y="80" width="6" height="6"/>

    <rect x="56" y="128" width="6" height="6"/>
    <rect x="68" y="128" width="6" height="6"/>
    <rect x="86" y="128" width="6" height="6"/>
    <rect x="116" y="128" width="6" height="6"/>
    <rect x="140" y="128" width="6" height="6"/>

    <rect x="56" y="158" width="6" height="6"/>
    <rect x="68" y="158" width="6" height="6"/>
    <rect x="80" y="158" width="6" height="6"/>
    <rect x="92" y="158" width="6" height="6"/>
    <rect x="116" y="158" width="6" height="6"/>
    <rect x="128" y="158" width="6" height="6"/>
    <rect x="140" y="158" width="6" height="6"/>

    <rect x="56" y="170" width="6" height="6"/>
    <rect x="92" y="170" width="6" height="6"/>
    <rect x="116" y="170" width="6" height="6"/>
    <rect x="140" y="170" width="6" height="6"/>

    <rect x="62" y="180" width="6" height="6"/>
    <rect x="80" y="180" width="6" height="6"/>
    <rect x="104" y="180" width="6" height="6"/>
    <rect x="122" y="180" width="6" height="6"/>
    <rect x="140" y="180" width="6" height="6"/>
  </g>

  <!-- 中心可爱奶昔杯 -->
  <g transform="translate(100 100)">
    <!-- 圆形底色，盖在二维码点阵上 -->
    <circle r="34" fill="#f5efe2"/>
    <circle r="32" fill="none" stroke="#e08a3c" stroke-width="1.2" stroke-dasharray="2 2"/>

    <!-- 杯身 -->
    <path d="M -14 -10 L 14 -10 L 11 18 Q 0 22 -11 18 Z" fill="#fff7e8" stroke="#1a1a1a" stroke-width="1.6"/>
    <!-- 杯里奶昔分层（粉 + 奶白） -->
    <path d="M -13 -2 Q 0 4 13 -2 L 11 18 Q 0 22 -11 18 Z" fill="#f1a3b6" opacity="0.9"/>
    <!-- 奶盖 -->
    <ellipse cx="0" cy="-10" rx="14" ry="3.2" fill="#fff" stroke="#1a1a1a" stroke-width="1.2"/>
    <!-- 樱桃 -->
    <circle cx="-3" cy="-13" r="2.4" fill="#e74c3c" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="-3" y1="-15.2" x2="2" y2="-19" stroke="#3a2317" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 笑眼 -->
    <circle cx="-4.5" cy="6" r="1" fill="#1a1a1a"/>
    <circle cx="4.5" cy="6" r="1" fill="#1a1a1a"/>
    <!-- 微笑 -->
    <path d="M -4 10 Q 0 13 4 10" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
    <!-- 腮红 -->
    <circle cx="-7.5" cy="9" r="1.6" fill="#f1a3b6" opacity="0.6"/>
    <circle cx="7.5" cy="9" r="1.6" fill="#f1a3b6" opacity="0.6"/>
  </g>

  <!-- 顶部小字 -->
  <text x="100" y="11" text-anchor="middle" font-size="6" letter-spacing="1.5" fill="#9a8c6a">DEMO · PLACEHOLDER ✦ REPLACE ME</text>
  <!-- 底部小字 -->
  <text x="100" y="197" text-anchor="middle" font-size="5.5" letter-spacing="1.2" fill="#9a8c6a">EVENT HORIZON CAFÉ · 占位收款码</text>
</svg>
